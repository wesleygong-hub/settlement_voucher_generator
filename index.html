<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>结算凭证生成器</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="voucher">
      <header class="voucher__header">
        <div class="voucher__title">
          <div class="voucher__company">上海外服（集团）有限公司</div>
          <div class="voucher__name">结算凭证</div>
        </div>
        <div class="voucher__meta">
          <label class="field">
            <span>凭证号码：</span>
            <input
              id="voucher-number"
              name="voucherNumber"
              type="text"
              required
              pattern="[A-Za-z0-9]+"
              placeholder="请输入字母/数字组合"
            />
          </label>
          <label class="field">
            <span>申请日期：</span>
            <input id="apply-date" name="applyDate" type="date" required />
            <small>格式：YYYY-MM-DD</small>
          </label>
        </div>
      </header>

      <section class="voucher__parties">
        <div class="party">
          <div class="party__label">购买方信息</div>
          <div class="party__content">
            <label class="field">
              <span>名称：</span>
              <input id="buyer-name" type="text" required />
            </label>
            <label class="field">
              <span>统一社会信用代码/纳税人识别号：</span>
              <input
                id="buyer-tax-id"
                type="text"
                required
                minlength="18"
                maxlength="18"
                placeholder="18位大写字母/数字"
              />
            </label>
          </div>
        </div>

        <div class="party">
          <div class="party__label">销售方信息</div>
          <div class="party__content party__content--readonly">
            <div class="field">
              <span>名称：</span>
              <span class="static-text">上海外服（集团）有限公司</span>
            </div>
            <div class="field">
              <span>统一社会信用代码/纳税人识别号：</span>
              <span class="static-text">91310000132209850J</span>
            </div>
          </div>
        </div>
      </section>

      <section class="voucher__table">
        <table>
          <thead>
            <tr>
              <th>项目名称</th>
              <th>金额</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td><input class="item-name" type="text" /></td>
              <td>
                <input class="item-amount" type="number" min="0" step="0.01" />
              </td>
            </tr>
            <tr>
              <td><input class="item-name" type="text" /></td>
              <td>
                <input class="item-amount" type="number" min="0" step="0.01" />
              </td>
            </tr>
            <tr>
              <td><input class="item-name" type="text" /></td>
              <td>
                <input class="item-amount" type="number" min="0" step="0.01" />
              </td>
            </tr>
            <tr>
              <td><input class="item-name" type="text" /></td>
              <td>
                <input class="item-amount" type="number" min="0" step="0.01" />
              </td>
            </tr>
            <tr>
              <td><input class="item-name" type="text" /></td>
              <td>
                <input class="item-amount" type="number" min="0" step="0.01" />
              </td>
            </tr>
            <tr>
              <td><input class="item-name" type="text" /></td>
              <td>
                <input class="item-amount" type="number" min="0" step="0.01" />
              </td>
            </tr>
          </tbody>
        </table>
      </section>

      <section class="voucher__totals">
        <label class="field">
          <span>合计金额（大写）：</span>
          <input id="total-upper" type="text" placeholder="请输入大写金额" />
        </label>
        <label class="field">
          <span>（小写）：</span>
          <input
            id="total-lower"
            type="number"
            min="0"
            step="0.01"
            placeholder="自动合计"
          />
        </label>
      </section>

      <section class="voucher__remark">
        <label class="field field--vertical">
          <span>备注：</span>
          <textarea id="remark" rows="4"></textarea>
        </label>
      </section>

      <section class="voucher__footer">
        <div class="stamp">上海外服（集团）有限公司 财务专用章</div>
        <label class="field">
          <span>开具人：</span>
          <input id="issuer" type="text" required />
        </label>
      </section>

      <section class="voucher__actions">
        <button id="validate-btn" type="button">校验并生成</button>
        <div id="error-list" class="error-list" aria-live="polite"></div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
